# Configuração central do projeto. Caminhos relativos à raiz do repositório.
seed: 20261114

paths:
  raw: data/raw
  zips: data/raw/_zips
  interim: data/interim
  processed: data/processed
  results: results
  models: models
  docs: docs

datasets:
  chapman:
    name: "A large scale 12-lead electrocardiogram database for arrhythmia study"
    version: "1.0.0"
    url: "https://physionet.org/static/published-projects/ecg-arrhythmia/a-large-scale-12-lead-electrocardiogram-database-for-arrhythmia-study-1.0.0.zip"
    zip: chapman.zip
    expected_bytes: 2498709074
    extract_dir: chapman
    # dicionário complementar para códigos presentes nos cabeçalhos mas ausentes de
    # ConditionNames_SNOMED-CT.csv: tabelas do PhysioNet/CinC Challenge 2021 (BSD-2-Clause)
    supplementary_dx_maps:
      commit: e2a75fc01f729cb74cc4e853e054ce81e28381fc
      dir: data/raw/snomed_maps
      files:
        dx_mapping_scored.csv: "https://raw.githubusercontent.com/physionetchallenges/evaluation-2021/e2a75fc01f729cb74cc4e853e054ce81e28381fc/dx_mapping_scored.csv"
        dx_mapping_unscored.csv: "https://raw.githubusercontent.com/physionetchallenges/evaluation-2021/e2a75fc01f729cb74cc4e853e054ce81e28381fc/dx_mapping_unscored.csv"
    # fronteira entre as duas fontes, inferida (ver docs/data_audit.md, seção 2.1)
    shaoxing_last_record: 10646
    fs: 500
    n_samples: 5000
  ptbxl:
    name: "PTB-XL, a large publicly available electrocardiography dataset"
    version: "1.0.3"
    url: "https://physionet.org/static/published-projects/ptb-xl/ptb-xl-a-large-publicly-available-electrocardiography-dataset-1.0.3.zip"
    zip: ptbxl.zip
    expected_bytes: 1839504686
    extract_dir: ptbxl
    fs: 500
    n_samples: 5000

# Sinal-alvo: aparelho MP-IoT descrito no TCC (Maggioni & Rebonatto, UPF)
target_signal:
  lead: "I"
  fs: 250
  window_samples: 2400        # 9,6 s
  band_hz: [0.05, 30.0]
  sensor: "AD8232"
  adc_bits: 12
  positive_only: true

# Agrupamento de rótulos. Os acrônimos são resolvidos para códigos SNOMED CT
# lendo ConditionNames_SNOMED-CT (Chapman) e scp_statements.csv (PTB-XL) —
# nenhum código SNOMED é escrito à mão aqui.
labels:
  groups: [AFIB, SINUS_NORMAL, SINUS_BRADY, SINUS_TACHY, SINUS_OUTRO, SINUS_ARRITMIA,
           FORA_DE_TREINO, CONFLITO, SEM_RITMO]
  chapman:
    # ritmos primários (acrônimos de ConditionNames_SNOMED-CT.csv). Códigos são lidos do arquivo.
    primary:
      AFIB: AFIB
      SR: SINUS
      SB: SINUS_BRADY
      ST: SINUS_TACHY
      SA: SINUS_ARRITMIA        # "Sinus Irregularity"
      AF: FORA_DE_TREINO        # flutter atrial
      SVT: FORA_DE_TREINO
      AT: FORA_DE_TREINO
      AVNRT: FORA_DE_TREINO
      AVRT: FORA_DE_TREINO
      SAAWR: FORA_DE_TREINO     # mesmo código SNOMED de WAVN no arquivo
      WAVN: FORA_DE_TREINO
      # acrônimos do dicionário complementar (CinC 2021), para códigos ausentes do oficial
      PR: FORA_DE_TREINO        # ritmo de marcapasso
      ARH: FORA_DE_TREINO       # ritmo atrial
      AVJR: FORA_DE_TREINO      # ritmo juncional
      JTach: FORA_DE_TREINO
      AJR: FORA_DE_TREINO
      AAR: FORA_DE_TREINO
      AIVR: FORA_DE_TREINO
      VEsR: FORA_DE_TREINO
      PVT: FORA_DE_TREINO       # TV paroxística
      VF: FORA_DE_TREINO
      VFL: FORA_DE_TREINO
      SARR: FORA_DE_TREINO      # parada sinusal
      Brady: FORA_DE_TREINO     # "bradicardia" sem origem informada
    # modificadores que tiram um ritmo sinusal do treino: ectopia, bloqueio AV, pré-excitação
    ectopy: [APB, ABI, VPB, VB, VET, VEB, VFW, JEB, JPT, PVC, BPAC, SVPB, AED]
    av_block: [1AVB, 2AVB, 2AVB1, 2AVB2, 3AVB, AVB, PRIE, IIAVBII, AVD, SAB]
    preexcitation: [WPW, VPE]
  ptbxl:
    primary:
      AFIB: AFIB
      SR: SINUS
      SBRAD: SINUS_BRADY
      STACH: SINUS_TACHY
      SARRH: SINUS_ARRITMIA
      AFLT: FORA_DE_TREINO
      SVTAC: FORA_DE_TREINO
      PSVT: FORA_DE_TREINO
      SVARR: FORA_DE_TREINO
      PACE: FORA_DE_TREINO
    ectopy: [PVC, PAC, PRC(S), BIGU, TRIGU]   # BIGU/TRIGU são enunciados de ritmo no PTB-XL, mas descrevem ectopia
    av_block: [1AVB, 2AVB, 3AVB, LPR]
    preexcitation: [WPW]
    norm_statement: NORM
    norm_min_likelihood: 100

audit:
  flat_std_mv: 0.005           # derivação com desvio-padrão < 5 µV é considerada plana
  amplitude_highpass_hz: 0.5   # filtro só para medir amplitude do QRS na auditoria
  n_jobs: 6

# ---------------------------------------------------------------- etapa 3
preprocess:
  fs_in_dataset: 500
  fs: 250                      # alvo (MP-IoT)
  window: 2400
  notch_hz: 50.0
  notch_q: 30.0
  band_hz: [0.05, 30.0]
  band_order: 4
  crop: center                 # center | random (random só no treino da CNN)

device:                        # simulate_device(): modelo simples do AD8232 + A/D
  adc_bits: 12
  vref_v: 3.3
  analog_gain: 100.0           # ganho de instrumentação do AD8232 (suposição documentada)
  offset_frac: 0.5             # sinal centrado no meio da escala -> só valores positivos

# ---------------------------------------------------------------- etapa 4
qrs:
  band_hz: [5.0, 18.0]
  integration_ms: 120
  refractory_ms: 250           # FC máxima detectável ~240 bpm
  search_back: true

sqi:
  min_beats: 4
  max_beats: 40                # 9,6 s a 250 bpm
  hr_range_bpm: [30, 220]
  max_flat_frac: 0.10          # fração da janela em trechos planos
  max_clip_frac: 0.02          # fração de amostras no máximo/mínimo da janela (saturação)
  min_qrs_agreement: 0.80      # concordância entre os dois detectores de QRS (bSQI)
  min_kurtosis: 3.0            # ECG limpo tem curtose alta; ruído gaussiano ~3

hr_rule:
  brady_bpm: 60                 # definição clínica de bradicardia sinusal; ajustável por pessoa
  tachy_bpm: 100                # definição clínica de taquicardia sinusal

# ---------------------------------------------------------------- etapa 5
experiment_a:
  source: shaoxing
  positive: [AFIB]
  negative: [SINUS_NORMAL, SINUS_OUTRO, SINUS_BRADY, SINUS_TACHY]
  split: [0.70, 0.15, 0.15]
  cv_folds: 5
  # ordem de simplicidade definida a priori (briefing seção 7)
  candidates: [logreg, random_forest, lightgbm, cnn]
  selection_metric: auprc_validation
  selection_margin: 0.010      # AUPRC absoluta; registrado antes de abrir o teste
  threshold_rule: {min_specificity: 0.98}
  bootstrap: 2000

# ---------------------------------------------------------------- etapa 6 (fixado antes de rodar B–I)
decision:
  p_confident: 0.50            # prob >= limiar e < 0,50 -> INCERTO (confiança baixa)
  ood_quantile: 0.995          # Mahalanobis > quantil 99,5% da validação -> INCERTO (fora do padrão)

experiment_b:
  ptbxl_groups_positive: [AFIB]
  ptbxl_groups_negative: [SINUS_NORMAL, SINUS_OUTRO, SINUS_BRADY, SINUS_TACHY]
  inverse_train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  inverse_val_fold: 9
  inverse_test_fold: 10

noise:
  url: "https://physionet.org/files/nstdb/1.0.0/"
  records: {bw: "oscilação de linha de base", ma: "ruído muscular", em: "movimento de eletrodo"}
  fs: 360
  snr_db: [24, 18, 12, 6, 0, -6]   # SNR = potência do ECG limpo filtrado / potência do ruído na janela

voting:
  m_values: [1, 2, 3, 4, 5, 6, 8, 10]
  windows_per_day: 9000            # 24 h / 9,6 s
  sim_days: 300
  episode_windows: [6, 31, 188]    # ~1 min, ~5 min, ~30 min de AFIB
  # regra de escolha (na validação): entre as configurações com sensibilidade por episódio
  # >= 0,99 para episódios de ~5 min, a de menor taxa de falsos alertas/dia; empate -> menor tempo até alerta
  selection_episode_windows: 31
  min_episode_sensitivity: 0.99
  refractory_windows: 0            # após um alerta, novo alerta só depois que a condição N-de-M deixar de valer

experiment_i:
  tcc_test_per_class: 356          # tamanho por classe do teste do TCC (Tabela 4)

# calibração do SQI (experimento F, fase 2) — fixada antes de rodar, depois de ver que o SQI inicial
# quase não filtrava ruído muscular/movimento de eletrodo no teste (D35). Feita só na validação.
sqi_calibration:
  grid:
    min_kurtosis: [3.0, 4.0, 5.0, 6.0, 7.0, 8.0, 10.0]
    min_qrs_agreement: [0.80, 0.85, 0.90, 0.95, 1.0]
  snr_db: [12, 6, 0, -6]
  max_clean_rejection: 0.05        # na validação limpa, para cada classe
  # critério: maior especificidade média nas janelas aprovadas sob ruído (todas as condições ruidosas)
